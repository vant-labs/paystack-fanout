name: CI

on:
  push:
  pull_request:

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check repository text
        shell: bash
        run: |
          set -euo pipefail
          pattern='co-authored-by|generated|\bai\b|codex|openai|chatgpt|claude|copilot|llm'
          if git grep -IinE "$pattern" -- . ':(exclude).githooks/commit-msg' ':(exclude).github/workflows/ci.yml'; then
            echo "prohibited text found in tracked files" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git log --format='%B' "$base..${{ github.sha }}" | grep -Eiq "$pattern"; then
            echo "prohibited text found in commit messages" >&2
            exit 1
          fi

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fanout
          POSTGRES_PASSWORD: fanout
          POSTGRES_DB: fanout
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U fanout -d fanout"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          SQLX_OFFLINE: true

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fanout
          POSTGRES_PASSWORD: fanout
          POSTGRES_DB: fanout
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U fanout -d fanout"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
        env:
          SQLX_OFFLINE: true
          DATABASE_URL: postgres://fanout:fanout@localhost:5432/fanout
          PAYSTACK_SECRET_KEY: sk_test_ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: paystack-fanout:ci
