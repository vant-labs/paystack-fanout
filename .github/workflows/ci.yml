name: CI

on:
  push:
  pull_request:

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check repository text
        shell: bash
        run: |
          set -euo pipefail
          pattern='co-authored-by|generated|\bai\b|codex|openai|chatgpt|claude|copilot|llm'
          if git grep -IinE "$pattern" -- . ':(exclude).githooks/commit-msg' ':(exclude).github/workflows/ci.yml'; then
            echo "prohibited text found in tracked files" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git log --format='%B' "$base..${{ github.sha }}" | grep -Eiq "$pattern"; then
            echo "prohibited text found in commit messages" >&2
            exit 1
          fi

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fanout
          POSTGRES_PASSWORD: fanout
          POSTGRES_DB: fanout
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U fanout -d fanout"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          SQLX_OFFLINE: true

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fanout
          POSTGRES_PASSWORD: fanout
          POSTGRES_DB: fanout
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U fanout -d fanout"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
        env:
          SQLX_OFFLINE: true
          DATABASE_URL: postgres://fanout:fanout@localhost:5432/fanout
          PAYSTACK_SECRET_KEY: sk_test_ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: paystack-fanout:ci

  dashboard-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Start local database
        run: docker compose up -d postgres
      - name: Build service
        run: cargo build
        env:
          SQLX_OFFLINE: true
      - name: Create owner
        run: printf 'long secure password\nlong secure password\n' | ./target/debug/paystack-fanout create-owner --email owner@example.com
        env:
          DATABASE_URL: postgres://fanout:fanout@localhost:5432/fanout
          FANOUT_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - name: Start service
        run: ./target/debug/paystack-fanout --role all --port 8080 &
        env:
          DATABASE_URL: postgres://fanout:fanout@localhost:5432/fanout
          FANOUT_CONFIG: config.example.toml
          PAYSTACK_SECRET_KEY: sk_test_ci
          FANOUT_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          COOKIE_SECURE: false
      - name: Wait for readiness
        run: timeout 60 bash -c 'until curl -fsS http://127.0.0.1:8080/readyz; do sleep 1; done'
      - name: Seed browser event
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, urllib.request
          body = json.dumps({"event": "charge.success", "data": {"reference": "tm_smoke_1", "metadata": {"app": "timamu"}}}).encode()
          signature = hmac.new(b"sk_test_ci", body, hashlib.sha512).hexdigest()
          request = urllib.request.Request("http://127.0.0.1:8080/in/paystack_main", data=body, method="POST", headers={"content-type": "application/json", "x-paystack-signature": signature})
          with urllib.request.urlopen(request) as response:
              assert response.status == 200
          PY
      - name: Install browser test dependencies
        run: python3 -m pip install playwright && python3 -m playwright install --with-deps chromium
      - name: Run browser smoke
        run: python3 tests/playwright_smoke.py
