services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fanout
      POSTGRES_PASSWORD: fanout
      POSTGRES_DB: fanout
    ports:
      - "5432:5432"
    volumes:
      - fanout-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanout -d fanout"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  fanout-postgres:

